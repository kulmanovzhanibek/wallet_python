# Alembic. URL берётся из переменной окружения DATABASE_URL (см. migrations/env.py),
# а не прописывается здесь: одна и та же миграция должна применяться и локально,
# и в CI, и в проде без правки файлов.
[alembic]
script_location = migrations
prepend_sys_path = .
# path_separator: как разделять пути в prepend_sys_path и version_locations.
path_separator = os
# Ревизии получают имя вида 0001_initial_schema — по имени сразу видно порядок.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = .venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
